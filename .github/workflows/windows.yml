name: Windows SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3


    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"


    - name: Install Dependencies
      run: |
        pip install bs4 requests


    - name: Install OpenSSH via Chocolatey
      run: |
        choco install openssh -y --no-progress

    - name: Setup SSH Server
      run: |
        # Install sshd service
        powershell -ExecutionPolicy Bypass -File "C:\Program Files\OpenSSH-Win64\install-sshd.ps1"

        # Start service
        Start-Service sshd
          Set-Service -Name sshd -StartupType Automatic


    - name: Configure SSH
      run: |
        net user runneradmin ${{ secrets.PASSWORD }}

        Start-Service sshd
        Set-Service -Name sshd -StartupType Automatic

        if (!(Get-NetFirewallRule -Name sshd -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name sshd `
              -DisplayName 'OpenSSH Server (sshd)' `
              -Enabled True `
              -Direction Inbound `
              -Protocol TCP `
              -Action Allow `
              -LocalPort 22
        }

        Get-Service sshd


    - name: Start SSH + Run Python Script
      env:
        DB_ADMIN_URL: ${{ secrets.DB_ADMIN_URL }}
      run: |
        echo "SSH server started on port 22"
        python main.py "Windows SSH Server:22" 22
