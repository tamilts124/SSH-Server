name: Windows SSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:

    - name: Checkout code
      uses: actions/checkout@v3


    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"


    - name: Install Dependencies
      run: |
        pip install bs4 requests


    - name: Ensure OpenSSH Server
      run: |
        Write-Host "Checking OpenSSH capability..."
    
        $cap = Get-WindowsCapability -Online | Where-Object Name -like 'OpenSSH.Server*'
    
        if ($cap.State -eq "Installed") {
            Write-Host "OpenSSH Server already installed"
        }
        else {
            Write-Host "OpenSSH not installed. Attempting install..."
    
            try {
                Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction Stop
                Write-Host "Installation succeeded"
            }
            catch {
                Write-Host "Installation failed (likely CI environment or missing source)"
                Write-Host "Continuing without install..."
            }
        }
    
        Write-Host "Final capability state:"
        Get-WindowsCapability -Online | Where-Object Name -like 'OpenSSH*'
    
        Write-Host "Checking sshd service..."
    
        $service = Get-Service sshd -ErrorAction SilentlyContinue
    
        if ($service) {
            Write-Host "Starting sshd..."
            Start-Service sshd
            Set-Service -Name sshd -StartupType Automatic
        }
        else {
            Write-Host "sshd service not available on this system"
        }


    - name: Configure SSH
      run: |
        net user runneradmin ${{ secrets.PASSWORD }}

        Start-Service sshd
        Set-Service -Name sshd -StartupType Automatic

        if (!(Get-NetFirewallRule -Name sshd -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name sshd `
              -DisplayName 'OpenSSH Server (sshd)' `
              -Enabled True `
              -Direction Inbound `
              -Protocol TCP `
              -Action Allow `
              -LocalPort 22
        }

        Get-Service sshd


    - name: Start SSH + Run Python Script
      env:
        DB_ADMIN_URL: ${{ secrets.DB_ADMIN_URL }}
      run: |
        echo "SSH server started on port 22"
        python main.py "Windows SSH Server:22" 22
